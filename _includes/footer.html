<footer>
  <hr class="slender">
  <ul class="footer-links">
    {% if site.email %}
      <li><a href="mailto:{{ site.email }}" aria-label="Email"><span class="icon-mail3"></span></a></li>
    {% endif %}
    {% for entry in site.data.social %}
      <li>
        <a href="{{ entry.link }}" aria-label="{{ entry.label }}"><span class="{{ entry.icon }}"></span></a>
      </li>
    {% endfor %}
  </ul>
<div class="credits">
<span>&copy; {{ site.time | date: '%Y' }} &nbsp;&nbsp;{{site.author | upcase }}</span><br><br>
<span>Built with <a href="https://github.com/clayh53/tufte-jekyll">Tufte-Jekyll</a> and <a href="https://jekyllrb.com">Jekyll</a>.</span>
</div>
</footer>
