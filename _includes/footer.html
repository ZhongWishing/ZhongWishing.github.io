<footer>
  <hr class="slender">
  <ul class="footer-links">
    {% if site.email %}
      <li><a href="mailto:{{ site.email }}" aria-label="Email"><span class="icon-mail3"></span></a></li>
    {% endif %}
    {% for entry in site.data.social %}
      <li>
        <a href="{{ entry.link | escape }}" target="_blank" rel="noopener noreferrer" aria-label="{{ entry.label | escape }}">{% include social-icon.html icon=entry.icon %}</a>
      </li>
    {% endfor %}
  </ul>
  <div class="credits">
    <span>&copy; {{ site.time | date: '%Y' }} &nbsp;&nbsp;{{ site.author | upcase }}</span>
  </div>
</footer>
